<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanning TKL - Nota Fiscal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        h1 { color: #2c3e50; }
        .form-row { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 8px 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; }
        button:hover { background: #2980b9; }
        button.danger { background: #e74c3c; }
        button.success { background: #27ae60; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; background: #f4f4f4; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
        .total { font-weight: bold; margin: 10px 0; }
        .loading { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <h1>Vanning TKL</h1>

    <h2>Adicionar Kit</h2>
    <div class="form-row">
        <input type="text" id="codigo" placeholder="Código (ex: AF.rack)">
        <input type="number" id="quantidade" placeholder="Quantidade" min="1" value="1">
        <button onclick="addKit()">Adicionar</button>
    </div>

    <h2>Lista de Kits <span id="contador"></span></h2>
    <ul id="lista"></ul>
    <div class="total" id="total"></div>

    <div class="form-row">
        <button class="success" onclick="enviarNota()">Gerar Nota Fiscal</button>
        <button class="danger" onclick="limparLista()">Limpar Lista</button>
        <button onclick="exportarJSON()">Exportar JSON</button>
    </div>

    <h3>Status</h3>
    <pre id="status">Aguardando...</pre>

    <script>
        const FLOW_URL = "https://default3855fb14c2214399b3f897d96a4ce4.5d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/bd3dd769e79c46cba4b8a7dcc0d892b9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OuAmSEDE75Z9wgIHtSg9RXTjUzhgwUD1nNbU_7tPtk8";

        // Load from localStorage
        let kits = JSON.parse(localStorage.getItem('vanning_kits') || '[]');
        
        function saveKits() {
            localStorage.setItem('vanning_kits', JSON.stringify(kits));
        }

        function addKit() {
            const codigoInput = document.getElementById('codigo');
            const qtdInput = document.getElementById('quantidade');
            const codigo = codigoInput.value.trim();
            const quantidade = parseInt(qtdInput.value);

            if (!codigo) {
                alert('Informe o código do kit');
                codigoInput.focus();
                return;
            }
            if (!quantidade || quantidade < 1) {
                alert('Quantidade inválida');
                qtdInput.focus();
                return;
            }

            // Merge duplicates
            const existente = kits.find(k => k.codigo.toLowerCase() === codigo.toLowerCase());
            if (existente) {
                if (confirm(`"${codigo}" já existe (Qtd: ${existente.quantidade}). Somar quantidades?`)) {
                    existente.quantidade += quantidade;
                } else {
                    kits.push({ codigo, quantidade });
                }
            } else {
                kits.push({ codigo, quantidade });
            }

            saveKits();
            renderLista();
            codigoInput.value = '';
            qtdInput.value = '1';
            codigoInput.focus();
        }

        function renderLista() {
            const lista = document.getElementById('lista');
            const contador = document.getElementById('contador');
            const total = document.getElementById('total');
            lista.innerHTML = '';
            
            let totalQtd = 0;
            kits.forEach((kit, i) => {
                totalQtd += kit.quantidade;
                const li = document.createElement('li');
                const span = document.createElement('span');
                span.textContent = `${kit.codigo} — Qtd: ${kit.quantidade}`;
                const btn = document.createElement('button');
                btn.className = 'danger';
                btn.textContent = 'Remover';
                btn.onclick = () => { 
                    if (confirm(`Remover "${kit.codigo}"?`)) {
                        kits.splice(i, 1); 
                        saveKits();
                        renderLista(); 
                    }
                };
                li.appendChild(span);
                li.appendChild(btn);
                lista.appendChild(li);
            });
            
            contador.textContent = kits.length ? `(${kits.length} itens)` : '';
            total.textContent = kits.length ? `Total de peças: ${totalQtd}` : '';
        }

        function limparLista() {
            if (kits.length === 0) return;
            if (confirm('Deseja limpar toda a lista?')) {
                kits = [];
                saveKits();
                renderLista();
            }
        }

        function exportarJSON() {
            const blob = new Blob([JSON.stringify({ kits }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vanning_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function enviarNota() {
            const status = document.getElementById('status');

            if (kits.length === 0) {
                alert('Adicione pelo menos um kit');
                return;
            }

            const payload = { 
                kits: kits,
                timestamp: new Date().toISOString(),
                total_itens: kits.reduce((s, k) => s + k.quantidade, 0)
            };
            
            document.body.classList.add('loading');
            status.textContent = 'Enviando...\n' + JSON.stringify(payload, null, 2);

            try {
                const response = await fetch(FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                status.textContent = `✅ Status: ${response.status}\nResposta: ${text || '(vazio)'}`;
                
                if (response.ok && confirm('Nota enviada! Limpar lista?')) {
                    kits = [];
                    saveKits();
                    renderLista();
                }
            } catch (error) {
                status.textContent = '❌ Erro: ' + error.message;
            } finally {
                document.body.classList.remove('loading');
            }
        }

        // Enter key support
        document.getElementById('codigo').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('quantidade').focus();
        });
        document.getElementById('quantidade').addEventListener('keypress', e => {
            if (e.key === 'Enter') addKit();
        });

        // Initial render
        renderLista();
    </script>
</body>
</html>
