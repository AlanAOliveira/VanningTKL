<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanning TKL - Teste QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        h1 { color: #2c3e50; }
        h2 { color: #34495e; }
        .form-row { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; align-items: center; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 10px 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 14px; }
        button:hover { background: #2980b9; }
        button.danger { background: #e74c3c; }
        button.success { background: #27ae60; }
        button.scan { background: #8e44ad; font-size: 16px; padding: 12px 24px; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; background: #f4f4f4; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .total { font-weight: bold; margin: 10px 0; font-size: 16px; }
        
        #scanner-container {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 8px;
        }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        
        .valid-kits {
            background: #d5f4e6;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .valid-kits code {
            background: #27ae60;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            margin: 0 3px;
            font-weight: bold;
        }
        
        #last-scan {
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            font-size: 16px;
        }
        .scan-success { background: #d5f4e6; color: #27ae60; border-left: 4px solid #27ae60; }
        .scan-error { background: #fadbd8; color: #e74c3c; border-left: 4px solid #e74c3c; }
    </style>
</head>
<body>
    <h1>🧪 Teste QR Scanner - Vanning TKL</h1>
    
    <div class="valid-kits">
        <strong>Kits válidos para teste:</strong>
        <code>SN</code> <code>SH</code> <code>FB</code> <code>FC</code>
    </div>

    <h2>📷 Scanner QR Code</h2>
    <div class="form-row">
        <label>Qtd:</label>
        <input type="number" id="quantidade" min="1" value="1" style="width: 80px;">
        <button class="scan" onclick="iniciarScanner()">
            📷 Escanear QR Code
        </button>
    </div>
    
    <div id="scanner-container">
        <div id="reader"></div>
        <p style="text-align: center; margin-top: 10px; color: #7f8c8d;">
            Aponte a câmera para o QR Code...
        </p>
        <div style="text-align: center;">
            <button class="danger" onclick="pararScanner()">❌ Cancelar</button>
        </div>
    </div>

    <div id="last-scan"></div>

    <h2>📋 Lista de Kits Escaneados</h2>
    <ul id="lista"></ul>
    <div class="total" id="total">Total: 0 peças</div>

    <div class="form-row">
        <button class="danger" onclick="limparLista()">🗑️ Limpar Lista</button>
    </div>

    <script>
        const KITS_VALIDOS = ['SN', 'SH', 'FB', 'FC'];
        
        let kits = [];
        let html5QrCode = null;
        let scannerAtivo = false;
        let processandoScan = false;

        function iniciarScanner() {
            if (scannerAtivo) return;
            
            const container = document.getElementById('scanner-container');
            container.style.display = 'block';
            processandoScan = false;
            
            html5QrCode = new Html5Qrcode("reader");
            
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                scannerAtivo = true;
            }).catch(err => {
                mostrarStatus('❌ Erro ao iniciar câmera: ' + err, false);
                container.style.display = 'none';
            });
        }

        function pararScanner() {
            if (html5QrCode && scannerAtivo) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    document.getElementById('scanner-container').style.display = 'none';
                    scannerAtivo = false;
                    processandoScan = false;
                }).catch(err => {
                    console.error('Erro ao parar:', err);
                    document.getElementById('scanner-container').style.display = 'none';
                    scannerAtivo = false;
                    processandoScan = false;
                });
            } else {
                document.getElementById('scanner-container').style.display = 'none';
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Evitar processar múltiplas vezes
            if (processandoScan) return;
            processandoScan = true;
            
            const codigo = decodedText.trim().toUpperCase();
            
            // Beep de confirmação
            beep();
            
            // Fechar câmera imediatamente após scan
            pararScanner();
            
            // Validar
            if (!KITS_VALIDOS.includes(codigo)) {
                mostrarStatus(`❌ "${codigo}" não é um kit válido! (Válidos: SN, SH, FB, FC)`, false);
                return;
            }
            
            const quantidade = parseInt(document.getElementById('quantidade').value) || 1;
            
            // Adicionar ou somar
            const existente = kits.find(k => k.codigo === codigo);
            if (existente) {
                existente.quantidade += quantidade;
                mostrarStatus(`✅ ${codigo} +${quantidade} (Total: ${existente.quantidade})`, true);
            } else {
                kits.push({ codigo, quantidade });
                mostrarStatus(`✅ ${codigo} adicionado (Qtd: ${quantidade})`, true);
            }
            
            renderLista();
        }

        function onScanError(error) {
            // Silencioso
        }

        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function mostrarStatus(msg, sucesso) {
            const el = document.getElementById('last-scan');
            el.textContent = msg;
            el.className = sucesso ? 'scan-success' : 'scan-error';
            el.style.display = 'block';
            
            setTimeout(() => {
                el.style.display = 'none';
            }, 4000);
        }

        function renderLista() {
            const lista = document.getElementById('lista');
            const total = document.getElementById('total');
            lista.innerHTML = '';
            
            let totalQtd = 0;
            kits.forEach((kit, i) => {
                totalQtd += kit.quantidade;
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${kit.codigo}</strong> — Qtd: ${kit.quantidade}</span>`;
                const btn = document.createElement('button');
                btn.className = 'danger';
                btn.textContent = 'Remover';
                btn.onclick = () => {
                    kits.splice(i, 1);
                    renderLista();
                };
                li.appendChild(btn);
                lista.appendChild(li);
            });
            
            total.textContent = `Total: ${totalQtd} peças (${kits.length} tipos)`;
        }

        function limparLista() {
            if (kits.length === 0) return;
            if (confirm('Limpar toda a lista?')) {
                kits = [];
                renderLista();
            }
        }

        renderLista();
    </script>
</body>
</html>
